<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CYN-X DX · Developer Workstation</title>
  <link rel="stylesheet" href="/static/cynx-theme.css?v=20261111-core1">
  <link rel="stylesheet" href="/static/dx.css?v=20261116-paw-hc1">
</head>
<body>
  <div class="dx-shell">
    <aside class="rail" aria-label="Developer tools navigation">
      <a class="brand" href="/dx" aria-label="CYN-X DX home"><span class="brand-paw">✣</span><span>CYN-X <b>DX</b></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav id="navigation" aria-label="Workspace sections">
        <button type="button" class="nav-item active" data-view="overview" aria-controls="view" aria-current="page"><span aria-hidden="true">⌂</span>Overview</button>
        <button type="button" class="nav-item" data-view="model" aria-controls="view"><span aria-hidden="true">◉</span>Model Lab</button>
        <button type="button" class="nav-item" data-view="benchmark" aria-controls="view"><span aria-hidden="true">▤</span>Benchmark Lab</button>
        <button type="button" class="nav-item" data-view="personality-studio" aria-controls="view"><span aria-hidden="true">✿</span>Personality Studio</button>
        <button type="button" class="nav-item" data-view="learning" aria-controls="view"><span aria-hidden="true">◌</span>Learning &amp; feedback</button>
        <button type="button" class="nav-item" data-view="tools" aria-controls="view"><span aria-hidden="true">⌘</span>Tool Explorer</button>
        <button type="button" class="nav-item" data-view="requests" aria-controls="view"><span aria-hidden="true">⌁</span>Request Inspector</button>
        <button type="button" class="nav-item" data-view="diagnostics" aria-controls="view"><span aria-hidden="true">✳</span>System Diagnostics</button>
        <button type="button" class="nav-item" data-view="configuration" aria-controls="view"><span aria-hidden="true">⚙</span>Configuration</button>
        <button type="button" class="nav-item" data-view="history" aria-controls="view"><span aria-hidden="true">◷</span>History</button>
      </nav>
      <div class="mascot-wrap"><img src="/static/puppygirl%20asset.png" alt="CYN-X puppy-girl mascot"><div class="mascot-note"><strong>Core companion</strong><span id="companion-message">Ready to inspect the system.</span></div></div>
      <a class="back-link" href="/">← Back to CYN-X chat</a>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">BARKLY LABS · DEVELOPER WORKSTATION</div><h1 id="page-title">System overview</h1></div><div class="top-actions"><span class="live-pill"><i></i> LOCAL CORE</span><button type="button" id="refresh" class="quiet-btn">↻ Refresh</button><button type="button" id="admin-logout" class="quiet-btn">Sign out</button></div></header>
      <div class="health-strip" id="health-strip" aria-live="polite"><span>Checking local services…</span></div>
      <section id="view" class="view" tabindex="-1" role="region" aria-labelledby="page-title"></section>
      <footer class="footnote"><span>CYN-X DX</span><span>Technology should adapt to people.</span></footer>
    </main>
    <aside class="context" id="context-panel" aria-label="System snapshot"><div class="context-head"><div><span class="eyebrow">CONTEXT PANEL</span><h2>System snapshot</h2></div><button type="button" class="icon-btn" id="toggle-context" aria-label="Collapse context panel" aria-expanded="true" title="Collapse context panel">›</button></div><div id="context-content" class="context-content"></div></aside>
  </div>
  <script src="/static/dx.js?v=20261116-paw-hc1" defer></script>
</body>
</html>
